[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-ai-integration-basic"
version = "0.1.0"
description = "API REST reutilizable para integrar IA generativa y multimedia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.161.1",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
]
optional-dependencies = {
    "media = [
        \"imageio-ffmpeg>=0.6.0,<1.0\",
        \"python-multipart>=0.0.20,<1.0\",
    ]",
    "dev = [
        \"pytest>=8.0\",
    ]",
}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"